# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      all-github-actions:
        patterns:
          - "*"

  # Replaces CompatHelper: keeps [compat] entries of all Julia projects up to date
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/lib/AtomsIOPython"
      - "/docs"
    schedule:
      interval: "weekly"
    groups:
      all-julia-packages:
        patterns:
          - "*"
